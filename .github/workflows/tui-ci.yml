name: tui-ci

on:
  push:
    branches: ["**"]
    paths:
      - "apps/tui/**"
      - ".github/workflows/tui-ci.yml"
  pull_request:
    paths:
      - "apps/tui/**"
      - ".github/workflows/tui-ci.yml"
  workflow_dispatch:

concurrency:
  group: tui-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, bb-tui]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/tui
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/../../tui-target/dev
    steps:
      - name: Limit build cache
        working-directory: .
        run: |
          size=$(du -sm "$CARGO_TARGET_DIR" 2>/dev/null | cut -f1 || echo 0)
          echo "build cache: ${size:-0} MiB"
          if [ "${size:-0}" -gt 8192 ]; then rm -rf "$CARGO_TARGET_DIR"; echo "build cache cleared"; fi
      - uses: actions/checkout@v5
      - run: cargo --version && rustc --version
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
