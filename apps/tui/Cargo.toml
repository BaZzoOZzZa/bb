[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
bb-wire = { path = "crates/bb-wire" }
bb-client = { path = "crates/bb-client" }
bb-store = { path = "crates/bb-store" }
bb-view = { path = "crates/bb-view" }

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart", "cookies", "http2", "charset", "stream", "query"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots", "url"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
pulldown-cmark = "0.13"
syntect = "5"
ratatui-textarea = "0.9"
nucleo-matcher = "0.3"
unicode-width = "0.2"
unicode-segmentation = "1"
dirs = "6"
keyring = "4"
vt100 = "0.16"
notify-rust = "4"
clap = { version = "4", features = ["derive", "env"] }
pretty_assertions = "1"
serde_urlencoded = "0.7"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
